[package]
name = "dime-ui"
description = "UI of the DIME IME: window layout and GDI drawing of the candidate window (later, the windows themselves)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dime-core = { path = "../dime-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

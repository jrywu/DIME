[package]
name = "dime-settings"
description = "DIMESettings.exe: the settings window (port of SettingsWindow). Window-free computations first; the window and the binary follow."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dime-config = { path = "../dime-config" }

[target.'cfg(windows)'.dependencies]
windows-link = "0.2.1"
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit"] }
